<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
        <title>To-Do List App</title>
    </head>
    <body>
        <header>
            <span class="line"></span>
            <span class="banner"><h1>Life Tasks</h1></span>
            <span class="line"></span>
        </header>
        <main class="grid-container">
            <div class="priorities">
                <h2>Top Priorities</h2>
                <hr>
                <div class="priorities-container"></div>
            </div>

            <div class="reminders">
                <h2>Reminders</h2>
                <hr>
                <div class="reminder-container">
                    <div onclick="addReminder(event)" class="add-reminder">
                        <input type="button" value="Add Reminder">
                    </div>
                </div>
            </div>
            
            <div onclick="addCategory(event)" class="add-category">
                <h2>Add New Category</h2>
            </div>
        </main>
    </body>
</html>
